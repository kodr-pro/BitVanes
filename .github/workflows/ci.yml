name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify vendored grammar checksums
        run: node scripts/fetch-grammars.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run compile
      - name: Package vsix
        run: npx vsce package --out bitvanes.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: bitvanes-vsix
          path: bitvanes.vsix
